<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>阿砚出题｜你画我猜</title><style>*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#f3f5f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(94vw,760px);margin:auto;padding:24px 0 40px}.top,.drawhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.title{font-size:24px;font-weight:800}.tag,.hint,.small{color:#9ca8bb}.card{background:#171a21;border:1px solid #2a3140;border-radius:22px;padding:16px}.board,.cw{background:#fff;border-radius:18px;overflow:hidden;aspect-ratio:1}.board{display:grid;place-items:center}.board svg{width:92%;height:92%}.chips{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.chip{border:1px solid #3a4560;border-radius:999px;padding:8px 12px;color:#d8e1f2}.ans{display:flex;gap:10px;margin-top:12px}.ans input{flex:1;min-width:0;background:#11151d;color:#fff;border:1px solid #303849;border-radius:14px;padding:14px 16px;font-size:16px}.btn{border:0;border-radius:14px;padding:13px 18px;background:#7aa2ff;color:#fff;font-size:16px;font-weight:700}.secondary{background:#2a3140}.good{background:#2f8f77}.msg{min-height:28px;margin-top:12px}.hidden{display:none!important}.prompt{font-size:28px;font-weight:800}.timer{font-size:34px;font-weight:800}.danger,.over{color:#ff8c9a!important}.cw canvas{display:block;width:100%;height:100%;touch-action:none}.tools{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px}.group{display:flex;gap:8px;flex-wrap:wrap}.stroke{align-self:center;color:#aeb7c6}.small{font-size:13px;line-height:1.5;margin-top:10px}.back{display:inline-block;margin-top:16px;color:#9fb8ff;text-decoration:none}@media(max-width:600px){.ans{flex-direction:column}.ans .btn{width:100%}.tools{flex-direction:column}.group .btn{flex:1}.prompt{font-size:24px}}</style></head><body><div class="wrap"><section id="guessRound"><div class="top"><div class="title">阿砚出题</div><div class="tag">20 秒 · 五笔</div></div><div class="card"><div class="board"><svg viewBox="0 0 600 600" aria-label="阿砚五笔简笔画"><g fill="none" stroke="#111" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M255 145 C205 165 175 210 180 275 C185 330 225 365 275 372 C310 377 340 365 360 345"/><path d="M225 245 Q250 228 278 245 M300 280 Q325 300 348 278"/><path d="M360 342 C395 315 430 295 470 286 L490 340 L438 360 Z"/><path d="M340 345 C375 385 405 410 448 425"/><path d="M445 420 L468 394 M445 420 L474 438"/></g></svg></div><div class="chips"><span class="chip">2 个字</span><span class="chip">动作类</span></div><div class="hint">阿砚重新画了。你猜。</div><div class="ans"><input id="guess" placeholder="输入答案…" autocomplete="off"><button id="submit" class="btn">提交</button></div><div id="msg" class="msg"></div></div></section><section id="drawRound" class="hidden"><div class="top"><div class="title">轮到你画</div><div class="tag">20 秒 · 五笔目标</div></div><div class="card"><div class="drawhead"><div><div class="tag">你的题目</div><div id="drawPrompt" class="prompt">—</div><div class="chips"><span id="count" class="chip">—</span><span id="cat" class="chip">—</span></div></div><div id="timer" class="timer">20</div></div><div class="cw"><canvas id="c"></canvas></div><div class="tools"><div class="group"><button id="start" class="btn good">开始 20 秒</button><button id="clear" class="btn secondary">清空</button><button id="new" class="btn secondary">换题</button></div><div id="strokes" class="stroke">0 / 5 笔</div></div><div class="tools"><button id="share" class="btn" style="width:100%">画完了，发给阿砚猜</button></div><div class="small">五笔只是挑战目标，超过还能继续。分享只发画布，不带题目。</div></div></section><a class="back" href="./">← 回主游戏</a></div><script>const answer='6Ieq5ouN',dec=s=>decodeURIComponent(escape(atob(s)));const g=document.getElementById('guess'),msg=document.getElementById('msg'),gr=document.getElementById('guessRound'),dr=document.getElementById('drawRound');function check(){const ok=g.value.trim().replace(/\s+/g,'')===dec(answer);msg.textContent=ok?'猜对了。轮到你画。':'不对，再猜。';msg.style.color=ok?'#88e0c2':'#ff8c9a';if(ok)setTimeout(()=>{gr.classList.add('hidden');dr.classList.remove('hidden');setup();scrollTo(0,0)},350)}submit.onclick=check;g.onkeydown=e=>{if(e.key==='Enter')check()};const bank={动物:['企鹅','刺猬','章鱼','袋鼠','海豚'],日常:['牙刷','闹钟','耳机','拖鞋','遥控器'],食物:['火锅','汉堡','冰淇淋','爆米花','奶茶'],动作:['打喷嚏','迟到','偷笑','摔跤','自拍'],情绪:['吃醋','尴尬','社恐','委屈','紧张'],场景:['加班','失眠','堵车','考试','约会']};let prompt='',category='';function pick(){const cs=Object.keys(bank);category=cs[Math.floor(Math.random()*cs.length)];const a=bank[category];prompt=a[Math.floor(Math.random()*a.length)];drawPrompt.textContent=prompt;count.textContent=[...prompt].length+' 个字';cat.textContent=category+'类';clearBoard();reset()}const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let drawing=false,n=0,dpr=1;function size(){const r=canvas.getBoundingClientRect();dpr=devicePixelRatio||1;canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';ctx.lineWidth=5}function p(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.onpointerdown=e=>{e.preventDefault();drawing=true;n++;renderN();const q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y)};canvas.onpointermove=e=>{if(!drawing)return;e.preventDefault();const q=p(e);ctx.lineTo(q.x,q.y);ctx.stroke()};onpointerup=()=>{drawing=false;ctx.closePath()};function renderN(){strokes.textContent=n+' / 5 笔';strokes.classList.toggle('over',n>5)}function clearBoard(){ctx.clearRect(0,0,canvas.width,canvas.height);n=0;renderN()}clear.onclick=clearBoard;newPrompt=document.getElementById('new');newPrompt.onclick=pick;let left=20,tid=null;function rt(){timer.textContent=left;timer.classList.toggle('danger',left<=5)}function reset(){if(tid)clearInterval(tid);tid=null;left=20;rt()}start.onclick=()=>{if(tid)return;tid=setInterval(()=>{left--;rt();if(left<=0){clearInterval(tid);tid=null}},1000)};share.onclick=async()=>{const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const f=new File([blob],'给阿砚猜.png',{type:'image/png'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'你画我猜',text:'阿砚，猜。'});return}}catch(e){if(e.name==='AbortError')return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='给阿砚猜.png';a.click()};function setup(){requestAnimationFrame(()=>{size();pick()})}onresize=()=>{if(!dr.classList.contains('hidden'))size()};</script></body></html>
