<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>阿砚出题｜你画我猜</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#f3f5f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}.wrap{width:min(92vw,760px);margin:0 auto;padding:28px 0 44px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.tag{font-size:14px;color:#9ca8bb}.card{background:#171a21;border:1px solid #2a3140;border-radius:22px;padding:18px;box-shadow:0 16px 40px #0006}.board{background:#fff;border-radius:18px;overflow:hidden;aspect-ratio:1/1;display:grid;place-items:center}.board svg{width:92%;height:92%}.hint{margin:14px 2px 10px;color:#aeb7c6;font-size:14px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 2px 8px}.chip{border:1px solid #3a4560;color:#d8e1f2;border-radius:999px;padding:8px 12px;font-size:13px}.answer{display:flex;gap:10px}.answer input{flex:1;min-width:0;border:1px solid #303849;background:#11151d;color:#fff;border-radius:14px;padding:14px 16px;font-size:16px;outline:none}.btn{border:0;background:#7aa2ff;color:#fff;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:700}.btn.secondary{background:#2a3140}.btn.good{background:#2f8f77}.btn.warn{background:#9b4052}.msg{min-height:30px;margin-top:12px;font-size:15px}.back{display:inline-block;margin-top:16px;color:#9fb8ff;text-decoration:none}.title{font-weight:800;font-size:22px}.hidden{display:none!important}
.draw-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.prompt{font-size:28px;font-weight:800;margin-top:4px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.timer{font-size:34px;font-weight:800;min-width:72px;text-align:right}.timer.danger{color:#ff8c9a}.canvas-wrap{background:#fff;border-radius:18px;overflow:hidden;aspect-ratio:1/1}.canvas-wrap canvas{display:block;width:100%;height:100%;touch-action:none;background:#fff}.tools{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}.toolgroup{display:flex;gap:8px;flex-wrap:wrap}.stroke{color:#aeb7c6;font-size:14px;align-self:center}.stroke.over{color:#ff8c9a;font-weight:700}.small{font-size:13px;color:#8f9aab;line-height:1.5;margin-top:10px}.round-sep{height:1px;background:#2a3140;margin:22px 0}
@media(max-width:600px){.wrap{width:94vw;padding-top:18px}.card{padding:14px}.answer{flex-direction:column}.answer .btn{width:100%}.prompt{font-size:24px}.timer{font-size:30px}.tools{flex-direction:column}.toolgroup .btn{flex:1}.draw-head{align-items:center}}
</style>
</head>
<body>
<div class="wrap">
  <section id="guessRound">
    <div class="top"><div class="title">阿砚出题</div><div class="tag">20 秒 · 五笔</div></div>
    <div class="card">
      <div class="board">
        <svg viewBox="0 0 600 600" aria-label="阿砚的简笔画">
          <g fill="none" stroke="#111" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
            <path d="M120 245 Q300 70 480 245"/>
            <path d="M120 245 Q300 305 480 245"/>
            <path d="M195 255 L280 350"/>
            <path d="M405 255 L320 350"/>
            <path d="M300 325 C282 325 276 342 283 355 C290 369 310 369 317 355 C324 342 318 325 300 325 L300 455 L260 525 L300 455 L342 525"/>
          </g>
        </svg>
      </div>
      <div class="chips"><span class="chip">3 个字</span><span class="chip">装备类</span></div>
      <div class="hint">阿砚已经画完了。你猜。</div>
      <div class="answer">
        <input id="guess" autocomplete="off" placeholder="输入答案…" />
        <button id="submit" class="btn">提交</button>
      </div>
      <div id="msg" class="msg"></div>
    </div>
  </section>

  <section id="drawRound" class="hidden">
    <div class="top"><div class="title">轮到你画</div><div class="tag">20 秒 · 五笔目标</div></div>
    <div class="card">
      <div class="draw-head">
        <div>
          <div class="tag">你的题目</div>
          <div id="drawPrompt" class="prompt">—</div>
          <div class="meta"><span id="drawCountChip" class="chip">— 个字</span><span id="drawCategoryChip" class="chip">— 类</span></div>
        </div>
        <div id="timer" class="timer">20</div>
      </div>

      <div class="canvas-wrap"><canvas id="drawCanvas"></canvas></div>

      <div class="tools">
        <div class="toolgroup">
          <button id="startTimer" class="btn good">开始 20 秒</button>
          <button id="clearCanvas" class="btn secondary">清空</button>
          <button id="newPrompt" class="btn secondary">换题</button>
        </div>
        <div id="strokeCount" class="stroke">0 / 5 笔</div>
      </div>
      <div class="tools">
        <div class="toolgroup" style="width:100%">
          <button id="shareCanvas" class="btn" style="flex:1">画完了，发给阿砚猜</button>
        </div>
      </div>
      <div class="small">五笔是挑战目标，不硬拦你。超过五笔会变红，但还能继续画。分享时只会发画布图片，不会把题目一起带出去。</div>
    </div>
  </section>

  <a class="back" href="./">← 回主游戏</a>
</div>
<script>
const accepted=["6ZmN6JC95Lye"];
const decode=s=>decodeURIComponent(escape(atob(s)));
const guessRound=document.getElementById('guessRound');
const drawRound=document.getElementById('drawRound');

function check(){
  const v=document.getElementById('guess').value.trim().replace(/\s+/g,'');
  const ok=accepted.some(x=>v===decode(x));
  const m=document.getElementById('msg');
  m.textContent=ok?'猜对了。轮到你画。':'不对，再猜。';
  m.style.color=ok?'#88e0c2':'#ff8c9a';
  if(ok){setTimeout(()=>{guessRound.classList.add('hidden');drawRound.classList.remove('hidden');setupRound();window.scrollTo({top:0,behavior:'smooth'});},450)}
}
document.getElementById('submit').onclick=check;
document.getElementById('guess').addEventListener('keydown',e=>{if(e.key==='Enter')check()});

const promptBank={
  动物:["企鹅","刺猬","长颈鹿","章鱼","袋鼠","骆驼","海豚","狐狸"],
  日常:["牙刷","雨伞","闹钟","耳机","拖鞋","吹风机","充电器","遥控器"],
  食物:["火锅","汉堡","冰淇淋","爆米花","西瓜","寿司","奶茶","煎鸡蛋"],
  动作:["打喷嚏","熬夜","迟到","偷笑","摔跤","打哈欠","排队","自拍"],
  情绪:["吃醋","尴尬","社恐","生气","委屈","紧张","得意","无语"],
  场景:["加班","失眠","堵车","考试","约会","搬家","开会","下雨"]
};
let currentPrompt='';
let currentCategory='';
function pickPrompt(){
  const cats=Object.keys(promptBank);currentCategory=cats[Math.floor(Math.random()*cats.length)];
  const arr=promptBank[currentCategory];currentPrompt=arr[Math.floor(Math.random()*arr.length)];
  document.getElementById('drawPrompt').textContent=currentPrompt;
  document.getElementById('drawCountChip').textContent=[...currentPrompt].length+' 个字';
  document.getElementById('drawCategoryChip').textContent=currentCategory+'类';
  clearBoard();resetTimer();
}

const canvas=document.getElementById('drawCanvas');
const ctx=canvas.getContext('2d');
let drawing=false, strokes=0, dpr=1;
function sizeCanvas(){
  const rect=canvas.getBoundingClientRect();dpr=window.devicePixelRatio||1;
  canvas.width=Math.max(1,Math.floor(rect.width*dpr));canvas.height=Math.max(1,Math.floor(rect.height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';ctx.lineWidth=5;
}
function point(e){const r=canvas.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}
function startDraw(e){e.preventDefault();drawing=true;strokes++;renderStrokes();const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)}
function moveDraw(e){if(!drawing)return;e.preventDefault();const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()}
function endDraw(e){if(!drawing)return;drawing=false;ctx.closePath()}
canvas.addEventListener('pointerdown',startDraw);canvas.addEventListener('pointermove',moveDraw);window.addEventListener('pointerup',endDraw);
function renderStrokes(){const el=document.getElementById('strokeCount');el.textContent=strokes+' / 5 笔';el.classList.toggle('over',strokes>5)}
function clearBoard(){ctx.clearRect(0,0,canvas.width,canvas.height);strokes=0;renderStrokes()}
document.getElementById('clearCanvas').onclick=clearBoard;
document.getElementById('newPrompt').onclick=pickPrompt;

let remaining=20,timerId=null;
function renderTimer(){const el=document.getElementById('timer');el.textContent=remaining;el.classList.toggle('danger',remaining<=5)}
function resetTimer(){if(timerId){clearInterval(timerId);timerId=null}remaining=20;renderTimer()}
document.getElementById('startTimer').onclick=()=>{if(timerId)return;timerId=setInterval(()=>{remaining--;renderTimer();if(remaining<=0){clearInterval(timerId);timerId=null;remaining=0;renderTimer();try{navigator.vibrate&&navigator.vibrate([120,50,120])}catch(e){} }},1000)};

async function shareCanvas(){
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  if(!blob)return;
  const file=new File([blob],'给阿砚猜.png',{type:'image/png'});
  try{
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'你画我猜',text:'阿砚，猜。'});return;
    }
  }catch(e){if(e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='给阿砚猜.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
document.getElementById('shareCanvas').onclick=shareCanvas;

function setupRound(){requestAnimationFrame(()=>{sizeCanvas();pickPrompt()})}
window.addEventListener('resize',()=>{if(!drawRound.classList.contains('hidden')) sizeCanvas()});
</script>
</body>
</html>
